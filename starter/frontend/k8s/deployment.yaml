apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 934225420335.dkr.ecr.us-east-1.amazonaws.com/frontend:6add4c8accb219d63eb1aa50c4906cc29da034ef
          ports:
            - containerPort: 3000